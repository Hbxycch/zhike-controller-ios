name: ZhikeMonitor
options:
  bundleIdPrefix: com.zhike
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  ZhikeMonitor:
    type: application
    platform: iOS
    sources:
      - path: ZhikeMonitor
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhike.monitor
        PRODUCT_NAME: ZhikeMonitor
        INFOPLIST_FILE: ZhikeMonitor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_STYLE: Automatic
