name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -list -project ZhikeMonitor.xcodeproj

      - name: Build for simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild \
            -project ZhikeMonitor.xcodeproj \
            -scheme ZhikeMonitor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project ZhikeMonitor.xcodeproj \
            -scheme ZhikeMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ZhikeMonitor.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到 $APP_PATH"
            find build/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload ZhikeMonitor-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ZhikeMonitor-unsigned.ipa Payload
          ls -lh ZhikeMonitor-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZhikeMonitor-unsigned-ipa
          path: ZhikeMonitor-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Publish release (App 检查更新用)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*"\(.*\)"/\1/')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed 's/.*"\(.*\)"/\1/')
          TAG="v${VERSION}-b${BUILD}"
          NOTES=$(git log -1 --pretty=%B | head -5)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "ZhikeMonitor-unsigned.ipa" \
            --title "$TAG" \
            --notes "自动构建（build ${BUILD}）${NOTES}" || \
          gh release upload "$TAG" "ZhikeMonitor-unsigned.ipa" --clobber
          gh release view "$TAG" --json url,assets -q '.url, (.assets[].name)'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/Logs/Build/*.xcactivitylog
          retention-days: 3
          if-no-files-found: ignore
